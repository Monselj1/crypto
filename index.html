<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Exchange Rate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Crypto Exchange Rate</h1>
    <p>Select a cryptocurrency and a traditional currency to get the exchange rate.</p>

    <div class="selectors">
      <select id="crypto-select"></select>
      <select id="currency-select"></select>
      <button id="get-rate">Get Exchange Rate</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
